# Netlify config for when Base Directory is set to pdf-compressor/frontend in Netlify UI
[build]
  command = "cd ../.. && npm run build:admin"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://pdf-compress-pro-1.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
