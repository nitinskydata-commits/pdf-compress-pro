        <p style="color: #64748b; font-size: 0.875rem; margin-bottom: 1.5rem;">
          By <strong>Nitin & PDFCompress Pro Engineering Team</strong> (Document Systems Lead) • Published on 2026-09-01 • Last Updated 2026-09-19 • 6 min read
        </p>

        </div>
        <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 1.25rem; margin-bottom: 2rem;">
          <h2 style="font-size: 1.15rem; font-weight: 700; color: #166534; margin: 0 0 0.75rem;">Key Takeaways & Best Practices</h2>
          <ul style="margin: 0; padding-left: 1.25rem; color: #15803d;">
            <li style="margin-bottom: 0.5rem;">Typed PDFs use vector fonts which take bytes; scanned PDFs embed massive bitmap photos taking megabytes.</li><li style="margin-bottom: 0.5rem;">Scanning at 600 DPI creates 4x the pixel data of 300 DPI and 16x the data of 150 DPI.</li><li style="margin-bottom: 0.5rem;">Saving black-and-white text in 24-bit RGB color stores 3 color bytes per pixel unnecessarily.</li><li style="margin-bottom: 0.5rem;">Downsampling to 150 DPI and converting to grayscale slashes 80% of file weight with zero loss in legibility.</li>

      <section>
        <h2>The Core Difference: Vector Text vs. Raster Images</h2>
        <p>To understand why scanned PDFs are so huge, you must understand how PDFs store information.</p><p>When you create a document in Word, Google Docs, or LaTeX and export to PDF, the text is saved as character codes paired with font vector outlines. A single letter "A" takes approximately 2 bytes of storage. The PDF viewer draws the letter dynamically regardless of screen resolution.</p><p>When you feed that paper into a physical scanner or photograph it with your phone, the scanner does not see letters. It sees a massive grid of millions of colored pixels (a raster bitmap). Every single millimeter of paper—including blank white margins—is encoded as raw pixel values.</p>
        
        
        
      </section>
      <section>
        <h2>The Exponential Math of DPI (Dots Per Inch)</h2>
        <p>Many office multi-function printers default to scanning at 300 or 600 DPI in full 24-bit RGB color.</p><p>Consider the math of a standard 8.5 x 11 inch paper page scanned at 300 DPI: (8.5 × 300) × (11 × 300) = 2,550 × 3,300 = 8,415,000 pixels. At 24 bits (3 bytes) per pixel, an uncompressed single page requires 25.2 megabytes of raw memory!</p><p>At 600 DPI, that jumps to over 100 megabytes per page before compression. Even with standard JPEG compression, a 10-page document easily reaches 30MB to 50MB.</p>

        <h2>How to Fix Existing Scanned PDFs</h2>
        <p>If you already have a massive scanned PDF and cannot rescan the physical paper:</p><p>1. Upload it to PDFCompress Pro PDF Compressor.</p><p>2. Select Medium or High compression. Our engine intelligently detects raster image streams, performs bicubic downsampling to a calibrated target DPI (150 DPI for Medium, 110 DPI for High), and applies modern DCT quantization.</p><p>3. Download your compressed file. In most cases, a 30MB scan will shrink down to 2.5MB to 4MB with crisp, clear text.</p>

    <section>
      <h2>Frequently Asked Questions</h2>
      <dl>
        <dt style="font-weight: bold; margin-top: 1rem;">Does OCR (Optical Character Recognition) make a PDF larger or smaller?</dt><dd style="margin-left: 1rem; margin-top: 0.25rem;">OCR adds a tiny transparent text layer over the image so you can highlight and copy words. This text layer adds only a few kilobytes, but does not shrink the underlying raster photo unless you simultaneously downsample the image.</dd><dt style="font-weight: bold; margin-top: 1rem;">Can I compress a scanned PDF without losing signature clarity?</dt><dd style="margin-left: 1rem; margin-top: 0.25rem;">Yes. Selecting Medium compression maintains 150 DPI, which preserves handwritten pen strokes, official stamps, and signature details cleanly.</dd>
