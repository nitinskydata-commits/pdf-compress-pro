        <h2>Why College Assignment PDFs Become Unnecessarily Large</h2>
        <p>College students frequently encounter submission rejections like "File exceeds maximum upload size (2.0 MB)". How does a 4-page lab report balloon to 28 megabytes?</p><p>The primary cause is camera-based scanning apps (CamScanner, Adobe Scan, Apple Notes). Modern smartphones take 12MP to 48MP photos. When converted into a PDF, each page embeds a full-color 3000x4000 pixel image with uncompressed JPEG streams.</p><p>Additionally, inserting high-resolution microscope photos, engineering CAD diagrams, or uncompressed raw data graphs directly into Microsoft Word before saving as PDF embeds huge image objects.</p>
        
        
        
      </section>
      <section>
        <h2>4-Step Size Reduction Workflow for Students</h2>
        <p>1. Scan in Grayscale when color is not required: If your assignment is written in blue/black ink or typed text, avoid saving as 24-bit full color. Grayscale immediately drops file size by 66%.</p><p>2. Avoid taking screenshots of PDFs: Re-saving screenshots creates raster copies of what was once vector text, multiplying file size while reducing readability.</p><p>3. Use PDFCompress Pro to optimize stream objects: Upload your document to our PDF Compressor or "Compress PDF to 200KB" tool.</p><p>4. Select Medium or High compression depending on the portal limit. For strict 200KB limits on government or board exams (e.g. UPSC, SSC, university entrance exams), select the dedicated 200KB preset.</p>

      <section>
        <h2>How to Ensure TAs and Professors Can Read Your Work</h2>
        <p>The greatest danger of aggressive file compression is turning crucial subscripts, Greek letters, and handwritten exponents into illegible smudges.</p><p>Always open the output file and check your smallest handwriting samples (such as superscripts, minus signs, and coordinate labels on graphs).</p><p>If numbers blur together, re-run with "Medium" compression. Most academic portals that recommend 200KB will accept up to 1MB or 2MB if properly formatted.</p>
