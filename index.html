<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="google-site-verification" content="google45da80a9c5763d1d" />
    
    <!-- DNS Prefetching & Preconnect for Instant Opening -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
    
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2803958264462693" crossorigin="anonymous"></script>
    <title>PDFCompress Pro — Free Online PDF &amp; Image Tools</title>
    
    <style>
      /* Instant Zero-Delay Pre-Hydration Shell */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }
      .pre-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .pre-nav {
        height: 64px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
      }
      .pre-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        font-size: 1.125rem;
        color: #0f172a;
      }
      .pre-brand-badge {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 0.875rem;
      }
      .pre-hero {
        max-width: 800px;
        margin: 48px auto 0;
        padding: 0 1rem;
        text-align: center;
      }
      .pre-shimmer {
        background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
        background-size: 200% 100%;
        animation: pre-shimmer 1.5s infinite;
        border-radius: 12px;
      }
      @keyframes pre-shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .pre-box {
        max-width: 640px;
        height: 220px;
        margin: 32px auto 0;
        border: 2px dashed #cbd5e1;
        border-radius: 20px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant 0ms Shell displayed until JavaScript hydrates -->
      <div class="pre-shell">
        <div class="pre-nav">
          <div class="pre-brand">
            <div class="pre-brand-badge">P</div>
            <span>PDFCompress<span style="color: #2563eb;">Pro</span></span>
          </div>
          <div style="display: flex; gap: 16px; align-items: center;">
            <div class="pre-shimmer" style="width: 80px; height: 18px;"></div>
            <div class="pre-shimmer" style="width: 90px; height: 18px;"></div>
          </div>
        </div>
        <div class="pre-hero">
          <div class="pre-shimmer" style="width: 70%; height: 36px; margin: 0 auto 16px;"></div>
          <div class="pre-shimmer" style="width: 50%; height: 20px; margin: 0 auto;"></div>
          <div class="pre-box">
            <div style="text-align: center;">
              <div style="font-size: 2.2rem; margin-bottom: 8px;">⚡</div>
              <div style="font-size: 0.875rem; font-weight: 600; color: #64748b;">Loading high-speed engine...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
